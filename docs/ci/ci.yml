name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine-invariants:
    name: Engine invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the engine fixtures
        run: |
          set -euo pipefail
          for version in {4..15}; do
            python3 "src/build/build-v${version}.py"
          done

      - name: Run every suite
        run: |
          set -euo pipefail
          for suite in tests/check-*.cjs; do
            echo "::group::$suite"
            node "$suite"
            echo "::endgroup::"
          done

  reproducible-build:
    name: Build reproduces the shipped file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild the chain from src/base
        run: |
          set -euo pipefail
          for version in {4..15}; do
            python3 "src/build/build-v${version}.py"
          done

      - name: Check the shipped engine artifacts
        run: git diff --exit-code -- dist/
